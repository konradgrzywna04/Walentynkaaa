<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Walentynka 💘</title>
  <style>
    body {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: #e0f2f1;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }
    h1 {
      margin-bottom: 30px;
    }
    button {
      font-size: 18px;
      padding: 10px 25px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 0 10px;
    }
    .yes {
      background: #e53935;
      color: white;
    }
    .no {
      background: #607d8b;
      color: white;
      position: relative;
    }
  </style>
</head>
<body>

<div class="box">
  <h1>Czy chcesz zostać moją walentynką? 💖</h1>
  <button class="yes" onclick="yesClick()">Tak</button>
  <button class="no" onmouseover="moveNo()">Nie</button>
</div>

<script>
  function yesClick() {
    document.body.innerHTML = 
      <div style="text-align:center; font-size:40px; color:#b30059;">
        ❤️ Wiedziałem! ❤️<br><br>
        Kocham Cię 💕
      </div>
    ;
  }

  function moveNo() {
    const btn = document.querySelector('.no');
    btn.style.position = 'absolute';
    btn.style.left = Math.random() * 80 + '%';
    btn.style.top = Math.random() * 80 + '%';
  }
</script>

</body>
</html>
