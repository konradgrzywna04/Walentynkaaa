<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Julia 💕</title>

  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #ffe0ec, #fff5f9);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Dancing Script', cursive;
      overflow: hidden;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 35px 28px;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(255, 105, 180, 0.3);
      backdrop-filter: blur(10px);
      z-index: 2;
      animation: fadeIn 1.8s ease;
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-size: 34px;
      color: #c9184a;
      margin-bottom: 22px;
    }

    p {
      font-size: 22px;
      color: #c9184a;
      line-height: 1.5;
    }

    button {
      padding: 14px 30px;
      font-size: 22px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 10px 6px;
      font-family: 'Dancing Script', cursive;
      transition: all 0.3s ease;
      width: 100%;
      max-width: 260px;
    }

    #yes {
      background: linear-gradient(135deg, #ff4d6d, #ff8fa3);
      color: white;
      box-shadow: 0 12px 28px rgba(255, 77, 109, 0.45);
    }

    #yes:hover {
      transform: scale(1.06);
    }

    #no {
      background: transparent;
      color: #aaa;
    }

    .heart {
      position: absolute;
      font-size: 18px;
      animation: float 10s linear infinite;
      opacity: 0.65;
      pointer-events: none;
    }

    @keyframes float {
      0% {
        transform: translateY(110vh) scale(0.8);
        opacity: 0;
      }
      20% { opacity: 1; }
      100% {
        transform: translateY(-10vh) scale(1.4);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

  <!-- Muzyka w tle -->
  <audio autoplay loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7c3be0c3c1.mp3" type="audio/mpeg">
  </audio>

  <div class="card" id="card">
    <h1>Julio, czy zostaniesz moją walentynką? 💕</h1>
    <button id="yes">Tak, chcę 💖</button>
    <button id="no">Jeszcze chwilkę…</button>
  </div>

  <script>
    const yesBtn = document.getElementById("yes");
    const card = document.getElementById("card");

    yesBtn.addEventListener("click", () => {
      card.innerHTML = `
        <h1>Moja Julio 💗</h1>
        <p>
          Od momentu, gdy pojawiłaś się w moim życiu,<br>
          wszystko nabrało sensu.<br><br>

          Twój uśmiech potrafi rozjaśnić każdy dzień,<br>
          a Twoja obecność sprawia, że czuję spokój.<br><br>

          Jeśli pozwolisz,<br>
          chciałbym iść przez ten świat obok Ciebie —<br>
          dzień po dniu, serce przy sercu. 💕<br><br>

          <strong>Z miłością,<br>Konrad</strong>
        </p>
      `;
    });

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerText = "💗";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (Math.random() * 5 + 6) + "s";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 10000);
    }

    setInterval(createHeart, 500);
  </script>

</body>
</html>
