<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Moja Walentynka 💕</title>

  <!-- Romantyczna czcionka -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(180deg, #ffd6e8, #fff0f6);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Dancing Script', cursive;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      padding: 50px 60px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(255, 105, 180, 0.25);
      backdrop-filter: blur(8px);
      z-index: 2;
      animation: fadeIn 2s ease;
    }

    h1 {
      font-size: 42px;
      color: #c9184a;
      margin-bottom: 40px;
    }

    button {
      padding: 14px 32px;
      font-size: 22px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 10px;
      font-family: 'Dancing Script', cursive;
      transition: all 0.3s ease;
    }

    #yes {
      background: linear-gradient(135deg, #ff4d6d, #ff8fa3);
      color: white;
      box-shadow: 0 10px 25px rgba(255, 77, 109, 0.4);
    }

    #yes:hover {
      transform: scale(1.08);
    }

    #no {
      background: transparent;
      color: #999;
    }

    #no:hover {
      color: #666;
    }

    .heart {
      position: absolute;
      font-size: 20px;
      animation: float 10s linear infinite;
      opacity: 0.8;
    }

    @keyframes float {
      0% {
        transform: translateY(110vh) scale(0.8);
        opacity: 0;
      }
      20% { opacity: 1; }
      100% {
        transform: translateY(-10vh) scale(1.4);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <h1>Czy zostaniesz moją walentynką? 💕</h1>
    <button id="yes">Tak, z radością 💖</button>
    <button id="no">Jeszcze chwilkę…</button>
  </div>

  <script>
    const yesBtn = document.getElementById("yes");
    const card = document.getElementById("card");

    yesBtn.addEventListener("click", () => {
      card.innerHTML = `
        <h1>Dziękuję… 💗</h1>
        <p style="font-size:28px; color:#c9184a;">
          Każdy dzień jest piękniejszy,<br>
          gdy mogę go dzielić z Tobą.
        </p>
      `;
    });

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerText = "💗";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (Math.random() * 5 + 6) + "s";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 10000);
    }

    setInterval(createHeart, 500);
  </script>

</body>
</html>
