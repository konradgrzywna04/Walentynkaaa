<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Walentynka 💘</title>
  <style>
    body {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: #e0f2f1;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }
    h1 {
      margin-bottom: 30px;
    }
    <button type="button" id="yes">Tak</button>
<button type="button" id="no">Nie</button>
   
    }
  </style>
</head>
<script>
  alert("JS DZIAŁA!");
</script>
<body>

<div class="box">
  <h1>Czy chcesz zostać moją walentynką? 💖</h1>
  <button class="yes" onclick="yesClick()">Tak</button>
  <button class="no" onmouseover="moveNo()">Nie</button>
</div>

<script>
  function yesClick() {
    document.body.innerHTML = 
      <div style="text-align:center; font-size:40px; color:#b30059;">
        ❤️ Wiedziałem! ❤️<br><br>
        Kocham Cię 💕
      </div>
    ;
  }

  function moveNo() {
    const btn = document.querySelector('.no');
    btn.style.position = 'absolute';
    btn.style.left = Math.random() * 80 + '%';
    btn.style.top = Math.random() * 80 + '%';
  }
</script>

  <script>
  document.addEventListener("DOMContentLoaded", function () {
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");

    yesBtn.addEventListener("click", function () {
      document.body.innerHTML = 
        <div style="
          height:100vh;
          display:flex;
          justify-content:center;
          align-items:center;
          flex-direction:column;
          font-size:40px;
          color:#b30059;
          text-align:center;
        ">
          ❤️ Wiedziałem! ❤️<br>
          Kocham Cię 💕
        </div>
      ;
    });

    noBtn.addEventListener("mouseover", function () {
      noBtn.style.position = "absolute";
      noBtn.style.left = Math.random() * 80 + "%";
      noBtn.style.top = Math.random() * 80 + "%";
    });
  });
</script>
</body>
</html>
