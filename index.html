<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Julia ❤️</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #fde2e4, #fff1f3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      padding: 20px;
    }

    .bg-shape {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(255,182,193,0.6), transparent);
      border-radius: 50%;
      filter: blur(40px);
      z-index: 0;
    }
    .bg1 { top: -80px; left: -80px; }
    .bg2 { bottom: -100px; right: -100px; }

    .card {
      background: rgba(255, 255, 255, 0.96);
      padding: 34px 26px;
      border-radius: 26px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(200, 50, 90, 0.25);
      z-index: 2;
      max-width: 420px;
      width: 100%;
      animation: fadeIn 1.4s ease;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      color: #b5173a;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      color: #b5173a;
      line-height: 1.65;
    }

    button {
      width: 100%;
      max-width: 260px;
      padding: 14px;
      font-size: 18px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      margin: 10px 0;
      transition: 0.3s ease;
      font-family: 'Poppins', sans-serif;
    }

    #yes {
      background: linear-gradient(135deg, #ff4d6d, #ff8fa3);
      color: white;
    }

    #no {
      background: transparent;
      color: #aaa;
    }

    /* Serduszka */
    .heart {
      position: absolute;
      font-size: 18px;
      animation: float 9s linear infinite;
      opacity: 0.6;
      pointer-events: none;
    }

    /* SMUTNY OVERLAY */
    .sad-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 30, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-size: 120px;
      color: #fff;
      z-index: 999;
      animation: fadeInSad 1s ease;
    }

    .sad-text {
      font-size: 26px;
      margin-top: 20px;
      opacity: 0.8;
    }

    .tear {
      position: absolute;
      top: -20px;
      font-size: 22px;
      animation: rain 3s linear infinite;
      opacity: 0.6;
    }

    @keyframes rain {
      to {
        transform: translateY(110vh);
        opacity: 0;
      }
    }

    @keyframes float {
      to {
        transform: translateY(-110vh);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeInSad {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="bg-shape bg1"></div>
  <div class="bg-shape bg2"></div>

  <!-- Muzyka romantyczna -->
  <audio autoplay loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/10/26/audio_52cfc5e3de.mp3" type="audio/mpeg">
  </audio>

  <div class="card" id="card">
    <h1>Julia, czy zostaniesz moją walentynką? ❤️</h1>
    <button id="yes">Tak 💕</button>
    <button id="no">Muszę się zastanowić…</button>
  </div>

  <script>
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const card = document.getElementById("card");

    yesBtn.addEventListener("click", () => {
      card.innerHTML = `
        <h1>Julia ❤️</h1>
        <p>
          Od kiedy jesteś w moim życiu,<br>
          każdy dzień ma w sobie coś wyjątkowego.<br><br>

          Twoja obecność daje mi spokój,<br>
          a Twój uśmiech potrafi zmienić wszystko.<br><br>

          Z całego serca,<br><strong>Konrad</strong>
        </p>
      `;
    });

    noBtn.addEventListener("click", () => {
      const overlay = document.createElement("div");
      overlay.className = "sad-overlay";
      overlay.innerHTML = `
        😔
        <div class="sad-text">Chyba potrzebuję chwili…</div>
      `;
      document.body.appendChild(overlay);

      for (let i = 0; i < 40; i++) {
        const tear = document.createElement("div");
        tear.className = "tear";
        tear.textContent = "💧";
        tear.style.left = Math.random() * 100 + "vw";
        tear.style.animationDuration = (Math.random() * 2 + 2) + "s";
        document.body.appendChild(tear);

        setTimeout(() => tear.remove(), 3000);
      }
    });

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 9000);
    }

    setInterval(createHeart, 650);
  </script>

</body>
</html>
