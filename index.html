<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Julia ❤️</title>

  <!-- Czytelne, eleganckie czcionki -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Lato&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #fde2e4, #fff1f3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 32px 26px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(200, 50, 90, 0.25);
      z-index: 2;
      max-width: 420px;
      width: 100%;
      animation: fadeIn 1.5s ease;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      color: #b5173a;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      color: #b5173a;
      line-height: 1.6;
    }

    button {
      width: 100%;
      max-width: 260px;
      padding: 14px;
      font-size: 18px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      margin: 10px 0;
      transition: 0.3s ease;
    }

    #yes {
      background: linear-gradient(135deg, #ff4d6d, #ff8fa3);
      color: white;
      box-shadow: 0 10px 25px rgba(255, 77, 109, 0.4);
    }

    #yes:hover {
      transform: scale(1.05);
    }

    #no {
      background: transparent;
      color: #aaa;
    }

    .heart {
      position: absolute;
      font-size: 18px;
      animation: float 9s linear infinite;
      opacity: 0.6;
      pointer-events: none;
    }

    @keyframes float {
      0% {
        transform: translateY(110vh);
        opacity: 0;
      }
      20% { opacity: 1; }
      100% {
        transform: translateY(-10vh);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

  <!-- Romantyczna muzyka -->
  <audio autoplay loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/10/26/audio_52cfc5e3de.mp3" type="audio/mpeg">
  </audio>

  <div class="card" id="card">
    <h1>Julio, czy zostaniesz moją walentynką? ❤️</h1>
    <button id="yes">Tak, chcę 💕</button>
    <button id="no">Muszę się zastanowić…</button>
  </div>

  <script>
    const card = document.getElementById("card");
    const yesBtn = document.getElementById("yes");

    yesBtn.addEventListener("click", () => {
      card.innerHTML = `
        <h1>Julia ❤️</h1>
        <p>
          Od kiedy jesteś w moim życiu,<br>
          każdy dzień ma w sobie coś wyjątkowego.<br><br>

          Twoja obecność daje mi spokój,<br>
          a Twój uśmiech potrafi zmienić wszystko.<br><br>

          Chciałbym, żebyśmy szli dalej razem —<br>
          powoli, szczerze i z sercem. 💕<br><br>

          <strong>Z całego serca,<br>Konrad</strong>
        </p>
      `;
    });

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (Math.random() * 4 + 6) + "s";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 9000);
    }

    setInterval(createHeart, 600);
  </script>

</body>
</html>
