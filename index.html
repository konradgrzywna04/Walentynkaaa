# Walentynkaaa
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Walentynka </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 30px;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.3s ease;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
        }

        #noBtn {
            background-color: #adb5bd;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Czy chcesz zostać moją walentynką? </h1>
    <button id="yesBtn" onclick="yes()">Tak </button>
    <button id="noBtn" onclick="no()">Nie </button>
</div>

<script>
    let scale = 1;

    function no() {
        scale += 0.2;
        document.getElementById("yesBtn").style.transform = scale(${scale});
    }

    function yes() {
        document.body.innerHTML = 
            <div style="
                height:100vh;
                display:flex;
                align-items:center;
                justify-content:center;
                background: linear-gradient(135deg, #ff9a9e, #fad0c4);
                font-family: Arial;
                text-align:center;
            ">
                <h1>Dziękuję! 🥰❤️<br>Jesteś moją walentynką!</h1>
            </div>
        ;
    }
</script>

</body>
</html>
