<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Julia ❤️</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #fde2e4, #fff1f3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      padding: 20px;
    }

    /* Tło */
    .bg-shape {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(255,182,193,0.6), transparent);
      border-radius: 50%;
      filter: blur(40px);
      z-index: 0;
    }
    .bg1 { top: -80px; left: -80px; }
    .bg2 { bottom: -100px; right: -100px; }

    /* BIEGAJĄCE ZWIERZAKI */
    .pet {
      position: absolute;
      bottom: 30px;
      font-size: 42px;
      opacity: 0.5;
      z-index: 1;
      pointer-events: none;
    }

    .dog {
      left: -60px;
      animation: runRight 14s linear infinite;
    }

    .cat {
      right: -60px;
      animation: runLeft 18s linear infinite;
    }

    @keyframes runRight {
      0% { transform: translateX(0); }
      100% { transform: translateX(120vw); }
    }

    @keyframes runLeft {
      0% { transform: translateX(0); }
      100% { transform: translateX(-120vw); }
    }

    /* KARTA */
    .card {
      background: rgba(255,255,255,0.96);
      padding: 34px 26px;
      border-radius: 26px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(200,50,90,0.25);
      z-index: 2;
      max-width: 420px;
      width: 100%;
      animation: fadeIn 1.2s ease;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      color: #b5173a;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      color: #b5173a;
      line-height: 1.6;
    }

    button {
      width: 100%;
      max-width: 260px;
      padding: 14px;
      font-size: 18px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      margin: 10px 0;
    }

    #yes {
      background: linear-gradient(135deg, #ff4d6d, #ff8fa3);
      color: white;
    }

    #no {
      background: transparent;
      color: #aaa;
    }

    /* SERCA */
    .heart {
      position: absolute;
      font-size: 18px;
      animation: float 9s linear infinite;
      opacity: 0.6;
      pointer-events: none;
    }

    @keyframes float {
      to {
        transform: translateY(-110vh);
        opacity: 0;
      }
    }

    /* SAD MODE */
    .sad-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,15,25,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 999;
      color: white;
    }

    .sad-emoji { font-size: 120px; }
    .sad-text { font-size: 26px; margin-top: 20px; }

    .tear {
      position: absolute;
      top: -20px;
      font-size: 22px;
      animation: rain 3s linear infinite;
    }

    @keyframes rain {
      to {
        transform: translateY(110vh);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Tekst z animacją pisania */
    #loveText {
      font-size: 18px;
      line-height: 1.7;
      color: #b5173a;
      font-family: 'Poppins', sans-serif;
      white-space: pre-wrap;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="bg-shape bg1"></div>
  <div class="bg-shape bg2"></div>

  <!-- Zwierzaki -->
  <div class="pet dog">🐶</div>
  <div class="pet cat">🐱</div>

  <!-- Muzyka -->
  <audio id="romantic" autoplay loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/10/26/audio_52cfc5e3de.mp3" type="audio/mpeg">
  </audio>

  <audio id="sad">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_1c3f5e9b8c.mp3" type="audio/mpeg">
  </audio>

  <div class="card" id="card">
    <h1>Julia, czy zostaniesz moją walentynką? ❤️</h1>
    <button id="yes">Tak 💕</button>
    <button id="no">Muszę się zastanowić…</button>
    <p id="loveText"></p>
  </div>

  <script>
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const card = document.getElementById("card");
    const loveText = document.getElementById("loveText");
    const sadAudio = document.getElementById("sad");

    const loveMessage = `
Julia,

Od kiedy jesteś w moim życiu, 
nauczyłem się dostrzegać piękno w drobnych rzeczach. 
Twój uśmiech, Twój spokój, sposób, w jaki patrzysz na świat — 
to wszystko daje mi poczucie równowagi i nadziei.

Nie chcę obiecywać wielkich słów ani nierealnych rzeczy. 
Chcę po prostu być blisko Ciebie, 
dzielić codzienność i wspierać Cię w tym, co ważne. 
Chcę, żebyś wiedziała, że zawsze możesz na mnie liczyć.

Każdy dzień z Tobą byłby dla mnie prezentem — 
czasem cichym i spokojnym, czasem pełnym śmiechu. 
Chciałbym, abyśmy razem budowali coś prawdziwego, 
pełnego zaufania, cierpliwości i ciepła.

Z całego serca,
Konrad
`;

    yesBtn.addEventListener("click", () => {
      loveText.innerHTML = '';
      let index = 0;
      function typeWriter() {
        if(index < loveMessage.length){
          loveText.innerHTML += loveMessage.charAt(index) === '\n' ? '<br>' : loveMessage.charAt(index);
          index++;
          setTimeout(typeWriter, 35);
        }
      }
      typeWriter();
    });

    noBtn.addEventListener("click", () => {
      sadAudio.play();

      const overlay = document.createElement("div");
      overlay.className = "sad-overlay";
      overlay.innerHTML = `
        <div class="sad-emoji">😔</div>
        <div class="sad-text">Ale i tak będę czekał…</div>
      `;
      document.body.appendChild(overlay);

      for (let i = 0; i < 40; i++) {
        const tear = document.createElement("div");
        tear.className = "tear";
        tear.textContent = "💧";
        tear.style.left = Math.random() * 100 + "vw";
        tear.style.animationDuration = (Math.random() * 2 + 2) + "s";
        document.body.appendChild(tear);
        setTimeout(() => tear.remove(), 3000);
      }

      setTimeout(() => overlay.remove(), 5000);
    });

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 9000);
    }

    setInterval(createHeart, 700);
  </script>

</body>
</html>
